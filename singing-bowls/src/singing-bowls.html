<!DOCTYPE html>
<html lang="en">
<head>
  <title>Singing Bowls Simulator</title>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="description" content="Relaxing sound and ambience generator which can mimic the sounds of various kinds of singing bowls." />

  <meta name="twitter:card" content="summary" />
  <meta property="og:title" content="Singing Bowls Simulator" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://attilammagyar.github.io/toys/singing-bowls" />
  <meta property="og:image" content="https://attilammagyar.github.io/toys/singing-bowls/singing-bowls.jpg" />
  <meta property="og:image:alt" content="Screenshot of the singing bowls simulator" />
  <meta property="og:image:width" content="1280" />
  <meta property="og:image:height" content="720" />
  <meta property="og:description" content="Relaxing sound and ambience generator which can mimic the sounds of various kinds of singing bowls." />

  <link rel="stylesheet" href="singing-bowls.css" />
</head>
<body>
  <form id="main-form" action="#" method="get">
    <div id="error"></div>
    <div id="intro">
      <h1>Singing Bowls Simulator</h1>
      <p>
        Short click or tap = hit.<br/>
        Long click or tap = resonance.<br/>
        Click the button below to start.<br/>
      </p>
      <div><button id="start">Start</button></div>
      <p>
        <small>
          It is recommended to use headphones or external speakers for
          better sound quality.
        </small>
      </p>
    </div>
    <div id="bowls" class="hidden">
      <div id="tools">
        <div>
          <button id="autoplay-start" title="Start automation">
            <svg
              viewBox="0 0 100 100"
              stroke="#ffffff"
              stroke-width="1"
              fill="#ffffff"
              xmlns="http://www.w3.org/2000/svg">
             <g>
              <title>Start automation</title>
              <path d="M 10, 10  L 90, 50  L 10, 90  L 10, 10" stroke-linecap="round" stroke-linejoin="round" />
             </g>
            </svg>
          </button>
          <button id="autoplay-pause" class="hidden" title="Pause automation">
            <svg
              viewBox="0 0 100 100"
              stroke="#ffffff"
              stroke-width="1"
              fill="#ffffff"
              xmlns="http://www.w3.org/2000/svg">
             <g>
              <title>Pause automation</title>
              <rect height="80" width="27" y="10" x="10" stroke-width="1" stroke="#ffffff" fill="#ffffff" />
              <rect height="80" width="27" y="10" x="63" stroke-width="1" stroke="#ffffff" fill="#ffffff" />
             </g>
            </svg>
          </button>
          <label for="volume">Volume:</label>
          <input id="volume" name="volume" type="range" min="0" max="100" step="1" />
          <button id="settings" title="Settings">
            <svg
              viewBox="0 0 200 200"
              stroke="#ffffff"
              stroke-width="15"
              fill="none"
              xmlns="http://www.w3.org/2000/svg">
             <g>
              <title>Settings</title>
              <path d="M 123,13 A 90 90 0 0 1 145 22 L 138,39 A 72 72 0 0 1 157 56 L 173,48 A 90 90 0 0 1 184 69 L 168,78 A 72 72 0 0 1 171 103 L 189,107 A 90 90 0 0 1 184 131 L 166,127 A 72 72 0 0 1 152 149 L 163,163 A 90 90 0 0 1 144 178 L 133,163 A 72 72 0 0 1 108 171 L 107,189 A 90 90 0 0 1 83 188 L 84,170 A 72 72 0 0 1 60 160 L 48,173 A 90 90 0 0 1 30 157 L 42,143 A 72 72 0 0 1 31 121 L 13,123 A 90 90 0 0 1 10 99 L 28,96 A 72 72 0 0 1 33 71 L 18,61 A 90 90 0 0 1 31 41 L 46,51 A 72 72 0 0 1 67 35 L 61,18 A 90 90 0 0 1 85 11 L 90,28 A 72 72 0 0 1 116 29 L 123,13" stroke-linecap="round" stroke-linejoin="round" />
              <circle cx="100" cy="100" r="37" />
             </g>
            </svg>
          </button>
        </div>
        <div>
          <label for="presets">Preset:</label>
          <select id="presets" name="presets"></select>
          <button id="load-preset">load</button>
        </div>
        <div>
          <label for="noise-volume">Noise level:</label>
          <input id="noise-volume" name="noise-volume" type="range" min="0" max="100" step="1" />
        </div>
        <div>
          <label for="noise-modulation">Noise mod:</label>
          <input id="noise-modulation" name="noise-modulation" type="range" min="0" max="100" step="1" />
        </div>
        <div>
          <label for="echo">Echo:</label>
          <input id="echo" name="echo" type="range" min="0" max="99" step="1" />
        </div>
        <div>
          <label for="reverb">Reverb:</label>
          <input id="reverb" name="reverb" type="range" min="0" max="70" step="1" />
        </div>
      </div>
      <div id="bowls-container"></div>
    </div>
  </form>
  <div id="footer">
    <p>
      <a href="https://github.com/attilammagyar/toys"
        target="_blank">Source code on GitHub</a>
    </p>
  </div>
  <script type="text/javascript" src="singing-bowls.js"></script>
</body>
</html>
